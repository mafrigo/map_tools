ffmpeg_path: 'C:\Users\mfrigo\ffmpeg-master-latest-win64-gpl\bin\ffmpeg.exe'
frames_per_second: 30
movie_zoomout_seconds: 3
still_final_seconds: 3
ffmpeg_preset: veryfast  # x264 speed/size trade-off: ultrafast, veryfast, faster, medium, ...
ffmpeg_crf: 18  # lower = higher quality/larger file
tile_prefetch_workers: 12  # parallel tile downloads before rendering
max_cached_tiles: 1000  # in-memory OSM tile cache size (~0.2 MB per tile)
max_cached_background_maps: 200  # stitched background images kept in memory
map_extent_adjust: 0.2
osm_zoom_level_adjust: 1. # 2 for large screens
default_route_color: r
route_thickness: 1
text_color: black
add_trail_to_movies: True
fontsize_small: 10
fontsize_large: 12
image_dpi_resolution: 400
video_dpi_resolution: 300
default_min_frame_size_in_deg: 0.1
minimum_moving_speed: 10.0
